<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Входящие заявки</title>
    <style>
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      textarea {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        padding: 0.4rem 0.8rem;
        font: inherit;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Входящие заявки</h1>
    <form>
      <label for="message">Текст заявки</label>
      <textarea id="message" rows="4"></textarea>
      <button type="submit">Разобрать заявку</button>
    </form>
    <div aria-live="polite">
      <p id="notice"></p>
      <div id="result" hidden>
        <p>Тема: <strong id="topic"></strong></p>
        <p>Черновик ответа (проверьте перед отправкой):</p>
        <pre id="draft"></pre>
      </div>
    </div>
    <script type="module">
      const form = document.querySelector("form");
      const notice = document.querySelector("#notice");
      const result = document.querySelector("#result");
      const topic = document.querySelector("#topic");
      const draft = document.querySelector("#draft");

      const topicNames = {
        delivery: "Доставка",
        pricing: "Цены",
        other: "Другое",
      };

      function show(message, data) {
        notice.textContent = message;
        topic.textContent = data ? topicNames[data.topic] : "";
        draft.textContent = data ? data.draft : "";
        result.hidden = !data;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        show("Разбираем заявку…", null);
        try {
          const reply = await fetch("/api/triage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: document.querySelector("#message").value,
            }),
          });
          const data = await reply.json();
          if (data.status === "ready") {
            show("", data);
          } else if (data.status === "invalid_input") {
            show("Введите текст заявки.", null);
          } else if (data.status === "manual_review") {
            show(
              "AI не смог подготовить ответ. Разберите заявку вручную.",
              null,
            );
          } else {
            show("Ошибка сервера. Попробуйте ещё раз.", null);
          }
        } catch {
          show("Нет связи с сервером. Попробуйте ещё раз.", null);
        }
      });
    </script>
  </body>
</html>
